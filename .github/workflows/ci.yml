name: HarvestLink CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run unit tests
        run: npm test
      - name: Install API dependencies
        run: npm ci --prefix backend
      - name: Check API syntax
        run: npm --prefix backend run check
      - name: Audit API dependencies
        run: npm audit --prefix backend
